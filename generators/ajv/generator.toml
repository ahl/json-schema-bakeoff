# Integration for ajv, the JSON Schema validator for JavaScript. The exact
# version comes from the pinned npm package (see package.json) and names the
# results directory: `ajv 8.20.0`.
#
# ajv is a validator, not a code generator: it joins the bakeoff as a
# calibration row for the Node runner path, the way jsonschema-0.58 does for
# the Rust one. Anything other than ✅ here is the harness's doing or a
# documented policy, not a gap in the tool. See README.md.
name = "ajv"
language = "js"
kind = "validator"
homepage = "https://ajv.js.org"
description = """
The JSON Schema validator for JavaScript, and for much of the ecosystem the
reference implementation: it compiles a schema into purpose-built JS and runs
that at the boundary. No types come out; the schema stays the artifact. It's
the reference row for the Node path, resolving `localhost:1234` remotes from
`suite/remotes/` and shipping no formats, so `format` is ignored everywhere.
"""

[commands]
# Run with cwd = this directory, CARGO_TARGET_DIR = <repo>/target.
# {root} is the repo root; {out_dir}/{gen_dir}/{batch_dir} are absolute.
version  = "node generate.mjs version"
generate = "node generate.mjs generate {out_dir}"
build    = "node build.mjs {gen_dir} {batch_dir}"
