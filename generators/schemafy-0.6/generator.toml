# Integration for the schemafy 0.6 line. The exact version comes from the
# pinned `schemafy_lib` crate (see Cargo.toml) and names the results
# directory.
name = "schemafy-0.6"

language = "rust"
homepage = "https://crates.io/crates/schemafy_lib"
description = """
The original Rust JSON Schema → serde generator, usually used through the
`schemafy!` macro. Its design center is a hand-written draft-4 schema you own:
walk `properties` and `definitions`, name a struct or alias for each, and
get out of the way. It models structure only, so validation keywords vanish
and anything that isn't a plain object graph panics. The last release
(0.6.0) is from October 2021.
"""

[commands]
# Run with cwd = this directory, CARGO_TARGET_DIR = <repo>/target.
# {root} is the repo root; {out_dir}/{gen_dir}/{batch_dir} are absolute.
version  = "cargo run -q -- version"
generate = "cargo run -q -- generate {out_dir}"
build    = "cargo run -q --manifest-path {root}/Cargo.toml -p rust-batch -- build {gen_dir} {batch_dir}"
