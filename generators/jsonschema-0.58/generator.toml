# Integration for the jsonschema 0.58 line. The exact version comes from the
# pinned crate (see Cargo.toml) and names the results directory.
#
# jsonschema is a validator, not a code generator: it joins the bakeoff as a
# calibration row. Anything other than ✅ here is the harness's doing, not
# the tool's. See README.md.
name = "jsonschema-0.58"

language = "rust"
kind = "validator"
description = """
A Rust validator, not a generator: it interprets the schema at run time, so
it can enforce every keyword, which a type generator structurally can't. It's
the reference row: the ceiling the suite allows, a check on the harness, and
a price tag on the policies the generators live with. Remote refs come from
`suite/remotes/`, the dialect from the suite directory, and `format` stays at
the library default (asserted through draft 7, annotation-only after).
"""

[commands]
# Run with cwd = this directory, CARGO_TARGET_DIR = <repo>/target.
# {root} is the repo root; {out_dir}/{gen_dir}/{batch_dir} are absolute.
version  = "cargo run -q -- version"
generate = "cargo run -q -- generate {out_dir}"
build    = "cargo run -q --manifest-path {root}/Cargo.toml -p rust-batch -- build {gen_dir} {batch_dir}"
