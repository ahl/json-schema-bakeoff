# Integration for the jsonschema 0.58 line. The exact version comes from the
# pinned crate (see Cargo.toml) and names the results directory.
#
# jsonschema is a validator, not a code generator: it joins the bakeoff as a
# calibration row. Anything other than ✅ here is the harness's doing, not
# the tool's. See README.md.
name = "jsonschema-0.58"

description = """
jsonschema is a Rust validator, not a code generator: it interprets the
schema at run time instead of compiling it into types, so it can enforce
every keyword, which a type generator structurally cannot. It is the
reference row: it shows the ceiling the suite allows, calibrates the harness
(a miss here is a harness bug or a policy), and prices the policies the
generators live with. It resolves `localhost:1234` remotes from
`suite/remotes/`, selects the dialect from the suite directory, and leaves
`format` at the library default (asserted through draft 7, annotation-only
from 2019-09 on).
"""

[commands]
# Run with cwd = this directory, CARGO_TARGET_DIR = <repo>/target.
# {root} is the repo root; {out_dir}/{gen_dir}/{batch_dir} are absolute.
version  = "cargo run -q -- version"
generate = "cargo run -q -- generate {out_dir}"
build    = "cargo run -q --manifest-path {root}/Cargo.toml -p rust-batch -- build {gen_dir} {batch_dir}"
