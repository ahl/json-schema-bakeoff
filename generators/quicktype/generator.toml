# Integration for quicktype's `quicktype-core` library. The exact version
# comes from the pinned npm package (see package.json) and, with the
# target, names the results directory: `quicktype 26.0.0 go`.
name = "quicktype"
targets = ["rust", "go", "typescript"]

description = """
quicktype infers types from JSON samples or schemas and emits them in many
languages. Its design center is the shape of data: produce ergonomic,
compilable types everywhere, with serialization glue for each language.
Validation beyond type and shape is out of scope, so constraint keywords
(bounds, lengths, patterns, `const`, `oneOf` exclusivity) are accepted
silently. The TypeScript target adds a runtime type check; the Go target
leans on encoding/json's leniency.
"""

[commands]
# Run with cwd = this directory, CARGO_TARGET_DIR = <repo>/target.
# {root} is the repo root; {out_dir}/{gen_dir}/{batch_dir} are absolute.
version  = "node generate.mjs version {target}"
generate = "node generate.mjs generate {target} {out_dir}"
build    = "node build.mjs {target} {gen_dir} {batch_dir}"
