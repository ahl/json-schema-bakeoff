# Integration for the json-schema-rs 0.0 line. The exact version comes from
# the pinned crate (see Cargo.toml) and names the results directory.
name = "json-schema-rs-0.0"

language = "rust"
# Too thin to be worth a row; its page is still linked from RESULTS.md.
hidden = true
description = """
A young Rust generator (0.0.x) aimed at hand-written config schemas: the root
must be an object with `properties` or it refuses outright. Constraints come
out as attributes for its own validator, which serde ignores, so it's
measured on the little it does model.
"""

[commands]
# Run with cwd = this directory, CARGO_TARGET_DIR = <repo>/target.
# {root} is the repo root; {out_dir}/{gen_dir}/{batch_dir} are absolute.
version  = "cargo run -q -- version"
generate = "cargo run -q -- generate {out_dir}"
build    = "cargo run -q --manifest-path {root}/Cargo.toml -p rust-batch -- build {gen_dir} {batch_dir}"
