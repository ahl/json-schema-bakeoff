[package]
name = "json-schema-rs-0-0"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not a member of the repo workspace, so it has its own
# Cargo.lock and can pin whatever json-schema-rs it likes.
[workspace]

[dependencies]
anyhow = "1"
# Unreleased main, pinned by sha: the type-graph codegen (PR #68),
# cross-document $ref retrieval (PR #71), and self-validating types with
# constrained newtypes, on by default. No tag has been cut since 0.0.6.
# build.rs reads the version and the sha back out of Cargo.lock.
json-schema-rs = { git = "https://github.com/goddtriffin/json-schema-rs.git", rev = "1d1774d1ae3183f2290ac1472323754a335e5dd9" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
