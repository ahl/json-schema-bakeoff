[package]
name = "json-schema-rs-0-0"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not a member of the repo workspace, so it has its own
# Cargo.lock and can pin whatever json-schema-rs it likes.
[workspace]

[dependencies]
anyhow = "1"
# Unreleased main, pinned by sha: the type-graph codegen (PR #68),
# cross-document $ref retrieval (PR #71), and self-validating types with
# constrained newtypes, on by default, and (PR #269 era) the root type's
# name reported in `GenerateRustOutput::root_types`. No tag has been cut
# since 0.0.6.
# build.rs reads the version and the sha back out of Cargo.lock.
json-schema-rs = { git = "https://github.com/goddtriffin/json-schema-rs.git", rev = "8032443b0cd62c8f99ee1b4776e715fe553f8111" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
