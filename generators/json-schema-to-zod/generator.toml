# Integration for json-schema-to-zod. The exact versions come from the
# pinned npm packages (see package.json) and name the results directory:
# `json-schema-to-zod 2.8.1 + zod 4.6.6`.
name = "json-schema-to-zod"

# The emitted zod expression is erasable TypeScript (`parseOneOf` writes an
# explicit type argument), run by node's own type stripping rather than tsc.
language = "typescript"
homepage = "https://www.npmjs.com/package/json-schema-to-zod"
description = """
Turns a JSON Schema into a zod schema expression, so you get a static
TypeScript type and a runtime parser from one artifact. Its dispatcher keys
on `type`: a typed schema picks up bounds, lengths, patterns, enums and
`const`, while a schema without `type` becomes `z.any()` whatever else it
says. It has no `$ref` resolver. Unmaintained since March 2026; 2.8.1 is the
last release, and it runs on zod 4 here.
"""

[commands]
# Run with cwd = this directory. {out_dir}/{gen_dir}/{batch_dir} are absolute.
version  = "node generate.mjs version"
generate = "node generate.mjs generate {out_dir}"
build    = "node build.mjs {gen_dir} {batch_dir}"
