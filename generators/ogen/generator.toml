# Integration for ogen. The exact version comes from the pinned module
# (see go.mod) and names the results directory.
name = "ogen"
language = "go"
homepage = "https://ogen.dev"

description = """
An OpenAPI v3 generator for Go: its design center is an API document, and
it emits a type per schema with a code-generated JSON codec and validator on
top of `go-faster/jx`. Each group here is wrapped as an OpenAPI 3.1 document
with the schema as a component (3.1 schema objects are JSON Schema 2020-12,
so nothing is translated), and the check calls both `Decode` and
`Validate`.
"""

[commands]
# Run with cwd = this directory. {out_dir}/{gen_dir}/{batch_dir} are absolute.
# GOWORK=off so a stray go.work can't pull this module into a workspace;
# -mod=readonly so building the glue can never rewrite the pin in go.mod;
# GOTOOLCHAIN=local so a machine whose Go is older than ogen's `go 1.25.0`
# fails loudly instead of downloading a toolchain mid-measurement — these
# commands must never touch the network.
version  = "GOWORK=off GOFLAGS=-mod=readonly GOTOOLCHAIN=local go run . version"
generate = "GOWORK=off GOFLAGS=-mod=readonly GOTOOLCHAIN=local go run . generate {out_dir}"
build    = "GOWORK=off GOFLAGS=-mod=readonly GOTOOLCHAIN=local go run . build {gen_dir} {batch_dir}"
