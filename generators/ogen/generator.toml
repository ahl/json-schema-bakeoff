# Integration for ogen. The exact version comes from the pinned module
# (see go.mod) and names the results directory.
name = "ogen"
language = "go"
homepage = "https://ogen.dev"

description = """
An OpenAPI v3 generator for Go, so its design center is an API document
rather than a schema: it emits a client, a server, and a Go type per schema
whose JSON codec and validator are written out as code against
`github.com/go-faster/jx` instead of `encoding/json` and reflection. Each
group here is therefore wrapped as an OpenAPI 3.1 document whose
`components.schemas.Root` is the group's schema — 3.1 schema objects are
JSON Schema 2020-12, so the schema goes in untranslated — with one synthetic
operation that takes it as a request body, because ogen only generates types
something references. ogen splits the work across two methods, and the check
calls both: `Decode` enforces the type and the required-field set, `Validate`
enforces lengths, bounds, patterns and `uniqueItems`.
"""

[commands]
# Run with cwd = this directory. {out_dir}/{gen_dir}/{batch_dir} are absolute.
# GOWORK=off so a stray go.work can't pull this module into a workspace;
# -mod=readonly so building the glue can never rewrite the pin in go.mod;
# GOTOOLCHAIN=local so a machine whose Go is older than ogen's `go 1.25.0`
# fails loudly instead of downloading a toolchain mid-measurement — these
# commands must never touch the network.
version  = "GOWORK=off GOFLAGS=-mod=readonly GOTOOLCHAIN=local go run . version"
generate = "GOWORK=off GOFLAGS=-mod=readonly GOTOOLCHAIN=local go run . generate {out_dir}"
build    = "GOWORK=off GOFLAGS=-mod=readonly GOTOOLCHAIN=local go run . build {gen_dir} {batch_dir}"
