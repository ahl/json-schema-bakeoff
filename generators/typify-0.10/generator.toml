# Integration for the typify 0.10 line. The exact version comes from the
# pinned crate (see Cargo.toml) and names the results directory.
name = "typify-0.10"

language = "rust"
homepage = "https://crates.io/crates/typify"
description = """
Rust types for serde from JSON Schema, built to generate OpenAPI clients
(progenitor). Its design center is idiomatic Rust: structs, enums, newtypes,
`deny_unknown_fields` when the schema is closed. Validation is whatever the
type system can say; anything else is silently absent, and a construct it
can't model fails at generation rather than producing a wrong type. The 0.10
line is the in-progress rewrite on top of typespace.
"""

[commands]
# Run with cwd = this directory, CARGO_TARGET_DIR = <repo>/target.
# {root} is the repo root; {out_dir}/{gen_dir}/{batch_dir} are absolute.
version  = "cargo run -q -- version"
generate = "cargo run -q -- generate {out_dir}"
build    = "cargo run -q --manifest-path {root}/Cargo.toml -p rust-batch -- build {gen_dir} {batch_dir}"
