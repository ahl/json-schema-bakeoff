[package]
name = "typify-0-10"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not a member of the repo workspace, so it has its own
# Cargo.lock and can pin whatever typify it likes.
[workspace]

[dependencies]
anyhow = "1"
prettyplease = "0.3"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
syn = { version = "3", features = ["full"] }
typify = { version = "0.10.0-alpha.2", default-features = false }
