# Integration for go-jsonschema. The exact version comes from the pinned
# module (see go.mod) and names the results directory.
name = "go-jsonschema"
language = "go"
homepage = "https://github.com/omissis/go-jsonschema"

description = """
Go structs from JSON Schema, plus hand-written `UnmarshalJSON` methods that
re-check the schema's keywords while decoding. Its design center is a config
file with a known shape: a root that declares `type: object` becomes a tagged
struct, and `required`, `enum`, lengths, patterns and bounds are enforced in
the unmarshaller rather than left to the type system. The flip side is that a
root with no `type` keyword produces no root type at all, and the combinators
collapse into a merged type or `interface{}`.
"""

[commands]
# Run with cwd = this directory. {out_dir}/{gen_dir}/{batch_dir} are absolute.
# GOWORK=off so a stray go.work can't pull this module into a workspace;
# -mod=readonly so building the glue can never rewrite the pin in go.mod.
version  = "GOWORK=off GOFLAGS=-mod=readonly go run . version"
generate = "GOWORK=off GOFLAGS=-mod=readonly go run . generate {out_dir}"
build    = "GOWORK=off GOFLAGS=-mod=readonly go run . build {gen_dir} {batch_dir}"
